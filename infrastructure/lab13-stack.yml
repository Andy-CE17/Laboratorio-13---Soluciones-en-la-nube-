AWSTemplateFormatVersion: '2010-09-09'
Description: Laboratorio 13 - CRUD de empleados con DynamoDB y S3, VPC, EC2 y Aurora opcionales.

Parameters:
  ProjectPrefix:
    Type: String
    Default: dsn5c-lab13-acampos
    AllowedPattern: '[a-z0-9-]+'
  AdminCidr:
    Type: String
    Default: 127.0.0.1/32
    Description: IP publica autorizada para SSH. No usar 0.0.0.0/0.
  KeyName:
    Type: String
    Default: ''
    Description: Par de claves opcional; solo se utiliza al activar EC2.
  DeployEc2:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
  DeployAurora:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
  CreateAuroraReader:
    Type: String
    Default: 'true'
    AllowedValues: ['true', 'false']
  RepoUrl:
    Type: String
    Default: https://github.com/Andy-CE17/Laboratorio-13---Soluciones-en-la-nube-.git

Conditions:
  ShouldDeployEc2: !Equals [!Ref DeployEc2, 'true']
  ShouldDeployAurora: !Equals [!Ref DeployAurora, 'true']
  ShouldCreateReader: !And
    - !Condition ShouldDeployAurora
    - !Equals [!Ref CreateAuroraReader, 'true']

Resources:
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.13.0.0/16
      EnableDnsHostnames: true
      EnableDnsSupport: true
      Tags:
        - { Key: Name, Value: !Sub '${ProjectPrefix}-vpc-main' }
        - { Key: ActivityID, Value: lab13 }
        - { Key: Owner, Value: acampos }

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - { Key: Name, Value: !Sub '${ProjectPrefix}-igw-main' }
        - { Key: ActivityID, Value: lab13 }

  GatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref Vpc
      InternetGatewayId: !Ref InternetGateway

  PublicSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [0, !GetAZs '']
      CidrBlock: 10.13.0.0/24
      MapPublicIpOnLaunch: true
      Tags:
        - { Key: Name, Value: !Sub '${ProjectPrefix}-subnet-public-a' }
        - { Key: ActivityID, Value: lab13 }

  PublicSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [1, !GetAZs '']
      CidrBlock: 10.13.1.0/24
      MapPublicIpOnLaunch: true
      Tags:
        - { Key: Name, Value: !Sub '${ProjectPrefix}-subnet-public-b' }
        - { Key: ActivityID, Value: lab13 }

  PrivateSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [0, !GetAZs '']
      CidrBlock: 10.13.10.0/24
      MapPublicIpOnLaunch: false
      Tags:
        - { Key: Name, Value: !Sub '${ProjectPrefix}-subnet-private-a' }
        - { Key: ActivityID, Value: lab13 }

  PrivateSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [1, !GetAZs '']
      CidrBlock: 10.13.11.0/24
      MapPublicIpOnLaunch: false
      Tags:
        - { Key: Name, Value: !Sub '${ProjectPrefix}-subnet-private-b' }
        - { Key: ActivityID, Value: lab13 }

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - { Key: Name, Value: !Sub '${ProjectPrefix}-rtb-public' }
        - { Key: ActivityID, Value: lab13 }

  PublicDefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: GatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicRouteAssociationA:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: { RouteTableId: !Ref PublicRouteTable, SubnetId: !Ref PublicSubnetA }
  PublicRouteAssociationB:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: { RouteTableId: !Ref PublicRouteTable, SubnetId: !Ref PublicSubnetB }

  PrivateRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - { Key: Name, Value: !Sub '${ProjectPrefix}-rtb-private' }
        - { Key: ActivityID, Value: lab13 }
  PrivateRouteAssociationA:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: { RouteTableId: !Ref PrivateRouteTable, SubnetId: !Ref PrivateSubnetA }
  PrivateRouteAssociationB:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: { RouteTableId: !Ref PrivateRouteTable, SubnetId: !Ref PrivateSubnetB }

  S3GatewayEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref Vpc
      VpcEndpointType: Gateway
      ServiceName: !Sub 'com.amazonaws.${AWS::Region}.s3'
      RouteTableIds: [!Ref PrivateRouteTable]

  EmployeeTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${ProjectPrefix}-ddb-employees'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: employeeId, AttributeType: S }
      KeySchema:
        - { AttributeName: employeeId, KeyType: HASH }
      SSESpecification: { SSEEnabled: true }
      Tags:
        - { Key: Name, Value: !Sub '${ProjectPrefix}-ddb-employees' }
        - { Key: ActivityID, Value: lab13 }
        - { Key: Owner, Value: acampos }

  PhotoBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      BucketName: !Sub '${ProjectPrefix}-s3-employee-photos-${AWS::AccountId}'
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
      OwnershipControls:
        Rules: [{ ObjectOwnership: BucketOwnerEnforced }]
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: AbortIncompleteUploads
            Status: Enabled
            AbortIncompleteMultipartUpload: { DaysAfterInitiation: 1 }
      Tags:
        - { Key: Name, Value: !Sub '${ProjectPrefix}-s3-employee-photos' }
        - { Key: ActivityID, Value: lab13 }
        - { Key: Owner, Value: acampos }

  ApplicationRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${ProjectPrefix}-iamrole-app'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: ec2.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
        - PolicyName: EmployeeApplicationAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [dynamodb:Scan, dynamodb:GetItem, dynamodb:PutItem, dynamodb:DeleteItem]
                Resource: !GetAtt EmployeeTable.Arn
              - Effect: Allow
                Action: [s3:GetObject, s3:PutObject, s3:DeleteObject]
                Resource: !Sub '${PhotoBucket.Arn}/employees/*'

  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      InstanceProfileName: !Sub '${ProjectPrefix}-profile-app'
      Roles: [!Ref ApplicationRole]

  WebSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Acceso web y administracion restringida para Lab13
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - { IpProtocol: tcp, FromPort: 80, ToPort: 80, CidrIp: 0.0.0.0/0, Description: HTTP publico }
        - { IpProtocol: tcp, FromPort: 22, ToPort: 22, CidrIp: !Ref AdminCidr, Description: SSH desde IP autorizada }
      Tags:
        - { Key: Name, Value: !Sub '${ProjectPrefix}-sg-web' }
        - { Key: ActivityID, Value: lab13 }

  DatabaseSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: MySQL solo desde el servidor web
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 3306
          ToPort: 3306
          SourceSecurityGroupId: !Ref WebSecurityGroup
          Description: MySQL desde EC2
      Tags:
        - { Key: Name, Value: !Sub '${ProjectPrefix}-sg-rds' }
        - { Key: ActivityID, Value: lab13 }

  WebInstance:
    Type: AWS::EC2::Instance
    Condition: ShouldDeployEc2
    DependsOn: PublicDefaultRoute
    Properties:
      ImageId: '{{resolve:ssm:/aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64}}'
      InstanceType: t3.micro
      KeyName: !Ref KeyName
      IamInstanceProfile: { Name: !Ref InstanceProfile }
      SubnetId: !Ref PublicSubnetA
      SecurityGroupIds: [!Ref WebSecurityGroup]
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash -xe
          dnf update -y
          dnf install -y git nodejs npm nginx
          cd /opt
          git clone ${RepoUrl} lab13
          cd /opt/lab13
          npm ci --omit=dev
          cat > .env <<ENV
          PORT=8080
          DATA_MODE=aws
          AWS_REGION=${AWS::Region}
          DYNAMODB_TABLE=${EmployeeTable}
          S3_BUCKET=${PhotoBucket}
          SIGNED_URL_TTL=900
          ENV
          cat > /etc/systemd/system/atlas-people.service <<SERVICE
          [Unit]
          Description=Atlas People Lab13
          After=network.target
          [Service]
          WorkingDirectory=/opt/lab13
          ExecStart=/usr/bin/node src/app.js
          Restart=always
          User=ec2-user
          EnvironmentFile=/opt/lab13/.env
          [Install]
          WantedBy=multi-user.target
          SERVICE
          cat > /etc/nginx/conf.d/atlas-people.conf <<NGINX
          server {
            listen 80 default_server;
            server_name _;
            location / {
              proxy_pass http://127.0.0.1:8080;
              proxy_set_header Host \$host;
              proxy_set_header X-Forwarded-For \$proxy_add_x_forwarded_for;
            }
          }
          NGINX
          rm -f /etc/nginx/conf.d/default.conf
          chown -R ec2-user:ec2-user /opt/lab13
          systemctl daemon-reload
          systemctl enable --now atlas-people nginx
      Tags:
        - { Key: Name, Value: !Sub '${ProjectPrefix}-ec2-web' }
        - { Key: ActivityID, Value: lab13 }
        - { Key: Owner, Value: acampos }

  DatabaseSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Condition: ShouldDeployAurora
    Properties:
      DBSubnetGroupDescription: Subredes privadas para Aurora Lab13
      SubnetIds: [!Ref PrivateSubnetA, !Ref PrivateSubnetB]
      Tags:
        - { Key: Name, Value: !Sub '${ProjectPrefix}-rds-subnet-group' }

  AuroraCluster:
    Type: AWS::RDS::DBCluster
    Condition: ShouldDeployAurora
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      DBClusterIdentifier: !Sub '${ProjectPrefix}-rds-aurora'
      Engine: aurora-mysql
      DatabaseName: wordpress
      MasterUsername: labadmin
      ManageMasterUserPassword: true
      StorageEncrypted: true
      BackupRetentionPeriod: 1
      DBSubnetGroupName: !Ref DatabaseSubnetGroup
      VpcSecurityGroupIds: [!Ref DatabaseSecurityGroup]
      EnableIAMDatabaseAuthentication: true
      Tags:
        - { Key: Name, Value: !Sub '${ProjectPrefix}-rds-aurora' }
        - { Key: ActivityID, Value: lab13 }
        - { Key: Owner, Value: acampos }

  AuroraWriter:
    Type: AWS::RDS::DBInstance
    Condition: ShouldDeployAurora
    Properties:
      DBInstanceIdentifier: !Sub '${ProjectPrefix}-rds-writer'
      DBClusterIdentifier: !Ref AuroraCluster
      Engine: aurora-mysql
      DBInstanceClass: db.t4g.medium
      PubliclyAccessible: false
      Tags:
        - { Key: Name, Value: !Sub '${ProjectPrefix}-rds-writer' }
        - { Key: ActivityID, Value: lab13 }

  AuroraReader:
    Type: AWS::RDS::DBInstance
    Condition: ShouldCreateReader
    DependsOn: AuroraWriter
    Properties:
      DBInstanceIdentifier: !Sub '${ProjectPrefix}-rds-reader'
      DBClusterIdentifier: !Ref AuroraCluster
      Engine: aurora-mysql
      DBInstanceClass: db.t4g.medium
      PubliclyAccessible: false
      Tags:
        - { Key: Name, Value: !Sub '${ProjectPrefix}-rds-reader' }
        - { Key: ActivityID, Value: lab13 }

Outputs:
  VpcId: { Value: !Ref Vpc }
  EmployeeTableName: { Value: !Ref EmployeeTable }
  PhotoBucketName: { Value: !Ref PhotoBucket }
  WebSecurityGroupId: { Value: !Ref WebSecurityGroup }
  DatabaseSecurityGroupId: { Value: !Ref DatabaseSecurityGroup }
  WebPublicDns:
    Condition: ShouldDeployEc2
    Value: !GetAtt WebInstance.PublicDnsName
  AuroraWriterEndpoint:
    Condition: ShouldDeployAurora
    Value: !GetAtt AuroraCluster.Endpoint.Address
  AuroraReaderEndpoint:
    Condition: ShouldDeployAurora
    Value: !GetAtt AuroraCluster.ReadEndpoint.Address
  AuroraSecretArn:
    Condition: ShouldDeployAurora
    Value: !GetAtt AuroraCluster.MasterUserSecret.SecretArn
